<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | GINGER AND SPICE</title>
  <link rel="icon" href="/assets/icon-32.png" sizes="32x32">
  <style>
    :root {
      --ink: #1c1511;
      --muted: #6c625c;
      --paper: #fff8ec;
      --red: #9f1d20;
      --red-dark: #6f1115;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 34rem;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 0.5rem;
      color: var(--red);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1;
      letter-spacing: -0.04em;
      text-wrap: balance;
    }

    p { color: var(--muted); }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 1.5rem;
    }

    .actions a {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 0.75rem 1.2rem;
      border-radius: 999px;
      background: var(--red);
      color: #fff;
      font-weight: 800;
      text-decoration: none;
    }

    .actions a:hover,
    .actions a:focus-visible { background: var(--red-dark); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">GINGER AND SPICE · Gungahlin</p>
    <h1>We couldn't find that page.</h1>
    <p>The link may be old or mistyped. Try the home page or our menu, or call us on 02 6253 8721.</p>
    <div class="actions">
      <a href="/">Home</a>
      <a href="/menu/">Menu</a>
      <a href="tel:0262538721">Call 02 6253 8721</a>
    </div>
  </main>
</body>
</html>
